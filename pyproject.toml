[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "template-project"
version = "1.0.0"
description = "A Python project template following ports and adapters"
requires-python = ">=3.11"
dependencies = [
    "dynaconf>=3.2.0",
    "dependency-injector>=4.41.0",
    "pydantic>=2.11.0",
    "httpx>=0.27.0",
    "anthropic>=0.52.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["template_project"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
# Domain failures are named *Exception, not *Error, by house convention.
ignore = ["N818"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

# House style annotates enum members; mypy rejects that but Python accepts it.
[[tool.mypy.overrides]]
module = "template_project.domain.enums.*"
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = "dynaconf.*"
ignore_missing_imports = true

# dependency-injector cannot express Protocol dependencies or nested containers.
[[tool.mypy.overrides]]
module = "template_project.di_container"
disable_error_code = ["type-abstract", "assignment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=template_project --cov-report=term-missing"
